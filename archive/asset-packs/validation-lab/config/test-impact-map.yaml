# ResearchPath Test Impact Map Configuration
# Governed by Specification 29 Section 25

rules:
  # R Engine Mapping
  "engine/R/lib/power_analytic.R":
    - "apps/api/tests/test_advanced_power.py"
    - "apps/api/tests/test_power_enhanced.py"
    - "apps/api/tests/test_power_precision_sensitivity.py"
  "engine/R/lib/invariance.R":
    - "apps/api/tests/test_invariance_latent_means.py"
    - "apps/api/tests/test_measurement_invariance.py"
  "engine/R/lib/cfa.R":
    - "apps/api/tests/test_cfa_enhanced.py"
    - "apps/api/tests/test_cfa_cross_validation.py"
  "engine/R/lib/efa.R":
    - "apps/api/tests/test_efa_enhanced.py"
  "engine/R/lib/factorial_ancova.R":
    - "apps/api/tests/test_factorial_ancova.py"
  "engine/R/lib/repeated_mixed.R":
    - "apps/api/tests/test_repeated_mixed.py"
  "engine/R/lib/mi_rubin.R":
    - "apps/api/tests/test_mi_rubin_pooling.R"
  "engine/R/lib/imputation_runner.R":
    - "apps/api/tests/test_mice_typed.py"
    - "apps/api/tests/test_advanced_imputation.py"
  "engine/R/lib/longitudinal_advanced.R":
    - "apps/api/tests/test_longitudinal_riclpm.py"
    - "apps/api/tests/test_advanced_longitudinal.py"
  "engine/R/lib/cmb.R":
    - "apps/api/tests/test_cmb_ulmc.py"
    - "apps/api/tests/test_cmb_analysis.py"

  # Specs & Schemas Mapping
  "specs/*.schema.json":
    - "apps/api/tests/test_contracts.py"
    - "apps/api/tests/test_advanced_analysis_contracts.py"
    - "apps/api/tests/test_governance_contracts.py"

  # Python Services & Routes Mapping
  "apps/api/app/services/measurement.py":
    - "apps/api/tests/test_measurement.py"
    - "apps/api/tests/test_scoring_reliability.py"
  "apps/api/app/services/empirical_analysis.py":
    - "apps/api/tests/test_empirical_center.py"
  "apps/api/app/services/advanced_analysis.py":
    - "apps/api/tests/test_advanced_analysis_contracts.py"
    - "apps/api/tests/test_advanced_runner_unit.py"

fallbackMarker: "unit or contract or service"
